spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    # 不同模型的向量不能混用；旧 vectors.idx 保留，历史项目需另行重建索引。
    index-path: ./data/vectors-qwen3.7-text-embedding-1024.idx
  embedding-cfg:
    # 百炼北京 OpenAI 兼容接口；默认 1024 维，可用环境变量指定业务空间专属地址。
    api-base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    model: qwen3.7-text-embedding

llm:
  # NCS-108: providers/routing 唯一路由形态（熔断/failover 生效）；legacy llm.models 已弃用（解析保留+告警）。
  # 迁移说明与 yml/env/UI 优先级见 docs/llm-provider-fallback.md。
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  fallback:
    cooldown-seconds: 60
  providers:
    # 2026-09-07：百炼 Token Plan 专用套餐（与向量按量凭据隔离），qwen3.8-flash 单模型多参数档
    qwen-flash-write:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.8
      # 推理模型 reasoning_content 消耗大量输出 token；8192 会截断 3000+ 字正文
      max-tokens: 20000
      context-window: 64000
      # NCS-129/108: 命名 provider 路径应用 requestTimeoutSeconds（默认 180s 低于
      # 20k-token 真实生成耗时，Token Plan 实测构思期 CHARACTER_DESIGN 单次即 >120s）
      request-timeout-seconds: 900
      streaming: true
      style-guide: "严格遵循世界观设定中已确立的类型风格。人物名字必须与【出场人物】完全一致，绝对不得改名。不得引入与世界观不兼容的元素。"
    qwen-flash-plan:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.7
      # op-fix: 推理模型 reasoning_content 耗 token，8192 致总纲正文为空
      max-tokens: 16000
      request-timeout-seconds: 600
      context-window: 64000
      streaming: true
    qwen-flash-worldbuild:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.7
      max-tokens: 8192
      request-timeout-seconds: 600
      context-window: 64000
      streaming: true
    qwen-flash-check:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      request-timeout-seconds: 900
      context-window: 64000
      streaming: true
    qwen-flash-general:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      request-timeout-seconds: 900
      context-window: 64000
      streaming: true
    # NCS-066: 结构化提取（实体/事实/校验 JSON 输出）独立路由——输出需求远超 4096
    # （实体图谱实测 ~9.4k 字符截断）；提取不需要创意推理，关思考（DashScope enable_thinking:false）
    # 既释放输出预算又提速。实测质量劣化时可先调回 thinking-enabled: true。
    qwen-flash-extract:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.1
      max-tokens: 16000
      # NCS-174: 提取类调用（max 16k token）实测最慢 <2min——预算 600→300s 收紧，
      # 上游停滞时扇出阶段等待上限由此与 NCS-173 fanout 超时共同兜底
      request-timeout-seconds: 300
      context-window: 64000
      streaming: true
      thinking-enabled: false
  routing:
    default-providers: [qwen-flash-general]
    tasks:
      CHAPTER_WRITING: [qwen-flash-write]
      PLOTTING: [qwen-flash-plan]
      WORLDBUILDING: [qwen-flash-worldbuild]
      CHARACTER_DESIGN: [qwen-flash-worldbuild]
      CONTINUITY_CHECK: [qwen-flash-check]
      STYLE_GUARDIAN: [qwen-flash-check]
      MEMORY_SUMMARY: [qwen-flash-check]
      GENERAL: [qwen-flash-general]
      EXTRACTION: [qwen-flash-extract]
