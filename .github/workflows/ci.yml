name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload event log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            data/logs/
          if-no-files-found: ignore
