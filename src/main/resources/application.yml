spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: stub
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    index-path: ./data/vectors.idx
  embedding-cfg:
    api-base-url: https://open.bigmodel.cn/api/coding/paas/v4
    api-key: 03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR
    model: embedding-3

llm:
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  default-model:
    base-url: http://127.0.0.1:8088/v1
    api-key: sk-bookllm-4b-wuxia-2026
    model: qwen3-4b-wuxia
    temperature: 0.7
    max-tokens: 8192
    streaming: true
    style-guide: "严格遵循世界观设定中已确立的类型风格。不要引入与世界观类型不兼容的元素。人物名字必须与【出场人物】完全一致，绝对不得改名。"
