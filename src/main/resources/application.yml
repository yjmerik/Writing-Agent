spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    # 不同模型的向量不能混用；旧 vectors.idx 保留，历史项目需另行重建索引。
    index-path: ./data/vectors-qwen3.7-text-embedding-1024.idx
  embedding-cfg:
    # 百炼北京 OpenAI 兼容接口；默认 1024 维，可用环境变量指定业务空间专属地址。
    api-base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    model: qwen3.7-text-embedding

llm:
  # 多 provider 自动 fallback 配置见 docs/llm-provider-fallback.md；显式添加 providers/routing 后启用。
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  # 2026-08-29 切回 DeepSeek v4-flash（GLM coding 网关夜间对 >5min 长响应 StreamReset，不稳定）
  default-model:
    base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    temperature: 0.7
    max-tokens: 8192
    context-window: 64000
    streaming: true
    style-guide: "严格遵循世界观设定中已确立的类型风格。不要引入与世界观类型不兼容的元素。人物名字必须与【出场人物】完全一致，绝对不得改名。"
  models:
    CHAPTER_WRITING:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.8
      # 推理模型 reasoning_content 消耗大量输出 token；8192 会截断 3000+ 字正文
      max-tokens: 20000
      context-window: 64000
      style-guide: "严格遵循世界观设定中已确立的类型风格。人物名字必须与【出场人物】完全一致，绝对不得改名。不得引入与世界观不兼容的元素。"
    CONTINUITY_CHECK:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    PLOTTING:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.7
      # op-fix: 推理模型 reasoning_content 耗 token，8192 致总纲正文为空
      max-tokens: 16000
      context-window: 64000
    WORLDBUILDING:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.7
      max-tokens: 8192
      context-window: 64000
    CHARACTER_DESIGN:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.7
      max-tokens: 8192
      context-window: 64000
    STYLE_GUARDIAN:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    MEMORY_SUMMARY:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    GENERAL:
      base-url: ${DEEPSEEK_END_POINT:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000


