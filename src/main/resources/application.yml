spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    index-path: ./data/vectors.idx
  embedding-cfg:
    api-base-url: https://open.bigmodel.cn/api/coding/paas/v4
    api-key: 03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR
    model: embedding-3

llm:
  default-model:
    base-url: https://open.bigmodel.cn/api/coding/paas/v4
    api-key: 03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR
    model: glm-5.2
    temperature: 0.7
    max-tokens: 8192
    streaming: true
    style-guide: "纯东方玄幻/仙侠风格。禁止出现任何机械、科幻、数据流、电子屏、义眼、AI、代码、能量光谱等现代或科幻元素。所有超自然描写必须使用修仙体系术语（灵气、丹田、神识、法术、阵法、天劫等）。语言风格偏向古风但不过度文言。"
  models:
    CHAPTER_WRITING:
      base-url: https://open.bigmodel.cn/api/coding/paas/v4
      api-key: 03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR
      model: glm-5.2
      temperature: 0.8
      max-tokens: 8192
      style-guide: "纯东方玄幻/仙侠风格。绝对禁止出现机械、科幻、数据流、义眼、电子屏、AI、代码等现代/科幻元素。所有技术描写用修仙术语。人物对话要有古风韵味但不矫揉造作。"
    CONTINUITY_CHECK:
      base-url: https://open.bigmodel.cn/api/coding/paas/v4
      api-key: 03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR
      model: glm-5.2
      temperature: 0.3
      max-tokens: 4096
