spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    # 不同模型的向量不能混用；旧 vectors.idx 保留，历史项目需另行重建索引。
    index-path: ./data/vectors-qwen3.7-text-embedding-1024.idx
  embedding-cfg:
    # 百炼北京 OpenAI 兼容接口；默认 1024 维，可用环境变量指定业务空间专属地址。
    api-base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    model: qwen3.7-text-embedding

llm:
  # 多 provider 自动 fallback 配置见 docs/llm-provider-fallback.md；显式添加 providers/routing 后启用。
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  # 2026-09-07：百炼 Token Plan；专用套餐凭据与向量按量凭据隔离。
  default-model:
    base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
    model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
    temperature: 0.7
    max-tokens: 8192
    context-window: 64000
    streaming: true
    style-guide: "严格遵循世界观设定中已确立的类型风格。不要引入与世界观类型不兼容的元素。人物名字必须与【出场人物】完全一致，绝对不得改名。"
  models:
    CHAPTER_WRITING:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.8
      # 推理模型 reasoning_content 消耗大量输出 token；8192 会截断 3000+ 字正文
      max-tokens: 20000
      context-window: 64000
      style-guide: "严格遵循世界观设定中已确立的类型风格。人物名字必须与【出场人物】完全一致，绝对不得改名。不得引入与世界观不兼容的元素。"
    CONTINUITY_CHECK:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    PLOTTING:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.7
      # op-fix: 推理模型 reasoning_content 耗 token，8192 致总纲正文为空
      max-tokens: 16000
      context-window: 64000
    WORLDBUILDING:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.7
      max-tokens: 8192
      context-window: 64000
    CHARACTER_DESIGN:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.7
      max-tokens: 8192
      context-window: 64000
    STYLE_GUARDIAN:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    MEMORY_SUMMARY:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    GENERAL:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 64000
    # NCS-066: 结构化提取（实体/事实/校验 JSON 输出）独立路由——输出需求远超 GENERAL 4096
    # （实体图谱实测 ~9.4k 字符截断）；提取不需要创意推理，关思考（DashScope enable_thinking:false，
    # AUTO 按端点推断）既释放输出预算又提速。实测质量劣化时可先调回 thinking-enabled: true。
    EXTRACTION:
      base-url: ${DASHSCOPE_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_TOKEN_PLAN_API_KEY:}
      model: ${DASHSCOPE_TOKEN_PLAN_MODEL:qwen3.8-flash}
      temperature: 0.1
      max-tokens: 16000
      context-window: 64000
      thinking-enabled: false


