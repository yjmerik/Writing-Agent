spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    index-path: ./data/vectors.idx
  embedding-cfg:
    # 百炼（DashScope）OpenAI 兼容端点 + text-embedding-v3
    api-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_EMBEDDING_API_KEY:}
    model: text-embedding-v3

llm:
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  # 2026-08-28 切换 GLM-5.3-Flash（思考模型，产出 reasoning_content；max-tokens 已按推理模型放大）
  default-model:
    base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
    api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
    model: ${GLM_MODEL:glm-5.3-flash}
    temperature: 0.7
    max-tokens: 8192
    context-window: 128000
    thinking-enabled: false   # glm-5.3-flash 思考关闭：流水线速度与 token 成本
    streaming: true
    style-guide: "严格遵循世界观设定中已确立的类型风格。不要引入与世界观类型不兼容的元素。人物名字必须与【出场人物】完全一致，绝对不得改名。"
  models:
    CHAPTER_WRITING:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.8
      # 推理模型 reasoning_content 消耗大量输出 token；8192 会截断 3000+ 字正文
      max-tokens: 20000
      context-window: 128000
      thinking-enabled: false   # glm-5.3-flash 思考关闭：流水线速度与 token 成本
      style-guide: "严格遵循世界观设定中已确立的类型风格。人物名字必须与【出场人物】完全一致，绝对不得改名。不得引入与世界观不兼容的元素。"
    CONTINUITY_CHECK:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.3
      max-tokens: 4096
      context-window: 128000
      thinking-enabled: false   # glm-5.3-flash 思考关闭：流水线速度与 token 成本
    PLOTTING:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.7
      # op-fix: 推理模型 reasoning_content 耗 token，8192 致总纲正文为空
      max-tokens: 16000
      context-window: 128000
      thinking-enabled: false   # glm-5.3-flash 思考关闭：流水线速度与 token 成本
    WORLDBUILDING:
