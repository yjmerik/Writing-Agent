spring:
  application:
    name: writing-agent

persistence:
  relational: sqlite
  vector: embedded
  embedding: cloud-api
  sqlite:
    db-path: ./data/novel.db
  vector-store:
    # 不同模型的向量不能混用；旧 vectors.idx 保留，历史项目需另行重建索引。
    index-path: ./data/vectors-qwen3.7-text-embedding-1024.idx
  embedding-cfg:
    # 百炼北京 OpenAI 兼容接口；默认 1024 维，可用环境变量指定业务空间专属地址。
    api-base-url: ${DASHSCOPE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
    model: qwen3.7-text-embedding

llm:
  # NCS-108: providers/routing 唯一路由形态（熔断/failover 生效）；legacy llm.models 已弃用（解析保留+告警）。
  # 迁移说明与 yml/env/UI 优先级见 docs/llm-provider-fallback.md。
  # 录制/回放：确定性 E2E 的基石。mode: "off" | "record" | "replay"（off 必须加引号，否则 YAML 解析为 false）
  replay:
    mode: "off"
    dir: data/fixtures/llm
  fallback:
    cooldown-seconds: 60
  providers:
    # NCS-181: 2026-10-07 全量切换 glm-5.3-flash（智谱 coding 订阅通道，推理模型——
    # reasoning_content 消耗输出 token，max-tokens 按历史 GLM 配置放大）。
    # embedding 仍走百炼 qwen3.7-text-embedding（独立配置，不受影响）。
    glm-flash-write:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.8
      # glm-5.3-flash 始终思考，reasoning_content 大量消耗输出预算（实测 20000 全被思考耗尽截断）
      max-tokens: 40000
      context-window: 128000
      request-timeout-seconds: 900
      streaming: true
      style-guide: "严格遵循世界观设定中已确立的类型风格。人物名字必须与【出场人物】完全一致，绝对不得改名。不得引入与世界观不兼容的元素。"
    glm-flash-plan:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.7
      max-tokens: 32000
      request-timeout-seconds: 900
      context-window: 128000
      streaming: true
    glm-flash-worldbuild:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.7
      max-tokens: 32000
      request-timeout-seconds: 900
      context-window: 128000
      streaming: true
    glm-flash-check:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.3
      max-tokens: 24000
      request-timeout-seconds: 1500
      context-window: 128000
      streaming: true
    glm-flash-general:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.3
      max-tokens: 24000
      request-timeout-seconds: 900
      context-window: 128000
      streaming: true
    glm-flash-extract:
      base-url: ${GLM_END_POINT:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${GLM_API_KEY:03f6e85375e147d89e375af960b67a64.DnaPiga9EnuZZxmR}
      model: ${GLM_MODEL:glm-5.3-flash}
      temperature: 0.1
      max-tokens: 16000
      # NCS-174: 提取类调用收紧预算
      request-timeout-seconds: 300
      context-window: 128000
      streaming: true
      thinking-enabled: false
  routing:
    default-providers: [glm-flash-general]
    tasks:
      CHAPTER_WRITING: [glm-flash-write]
      PLOTTING: [glm-flash-plan]
      WORLDBUILDING: [glm-flash-worldbuild]
      CHARACTER_DESIGN: [glm-flash-worldbuild]
      CONTINUITY_CHECK: [glm-flash-check]
      STYLE_GUARDIAN: [glm-flash-check]
      MEMORY_SUMMARY: [glm-flash-check]
      GENERAL: [glm-flash-general]
      EXTRACTION: [glm-flash-extract]
